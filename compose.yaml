services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fci
      POSTGRES_PASSWORD: fci
      POSTGRES_DB: fci
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fci -d fci"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
