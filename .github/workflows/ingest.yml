name: Ingest

# Loads SAM.gov notices and USAspending awards into the hosted database.
# Secrets: DATABASE_URL (Neon *direct* connection string, not the pooled one) and
# SAM_API_KEY. Optional repository variable: SAM_DAILY_REQUEST_LIMIT (default 10).
#
# Daily (scheduled): notices delta, then the notices backfill resumes until it is
# complete (within the SAM request budget), then the awards delta.
# By hand: GitHub → Actions → Ingest → Run workflow, and pick a job.
on:
  schedule:
    - cron: "23 9 * * *" # 09:23 UTC: early morning US Eastern, before the M4 digest
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        options:
          - daily
          - awards-backfill
          - opportunities-backfill
        default: daily
      years:
        description: Years of award history (awards-backfill only)
        type: string
        default: "3"

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest (${{ github.event_name == 'schedule' && 'daily' || inputs.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      SAM_DAILY_REQUEST_LIMIT: ${{ vars.SAM_DAILY_REQUEST_LIMIT || '10' }}
      RAW_ARCHIVE_DIR: ${{ github.workspace }}/data/raw
      JOB: ${{ github.event_name == 'schedule' && 'daily' || inputs.job }}
      YEARS: ${{ inputs.years || '3' }}
    steps:
      - name: Check secrets
        id: ready
        run: |
          if [ -z "$DATABASE_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::notice::DATABASE_URL secret is not set yet; skipping the scheduled ingest."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Add the DATABASE_URL repository secret (Neon direct connection string)."
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler.*)
              echo "::error::DATABASE_URL is Neon's pooled connection string. Use the direct one (no '-pooler' in the host): ingest needs session locks and temp tables."
              exit 1
              ;;
          esac
          if [ -z "$SAM_API_KEY" ] && [ "$JOB" != "awards-backfill" ]; then
            echo "::error::Add the SAM_API_KEY repository secret."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.ready.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.ready.outputs.ok == 'true'
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Install
        if: steps.ready.outputs.ok == 'true'
        run: uv sync --locked
      - name: Migrate
        id: migrate
        if: steps.ready.outputs.ok == 'true'
        run: |
          uv run alembic upgrade head
          uv run app doctor

      # Manual jobs
      - name: Awards backfill
        if: steps.migrate.outcome == 'success' && env.JOB == 'awards-backfill'
        run: uv run app ingest awards-backfill --years "$YEARS"
      - name: Notices backfill
        if: steps.migrate.outcome == 'success' && env.JOB == 'opportunities-backfill'
        run: uv run app ingest opportunities --backfill

      # Daily: each step runs even if an earlier one failed
      - name: Notices delta
        if: steps.migrate.outcome == 'success' && env.JOB == 'daily' && !cancelled()
        run: uv run app ingest opportunities
      - name: Notices backfill (resumes until complete)
        if: steps.migrate.outcome == 'success' && env.JOB == 'daily' && !cancelled()
        run: uv run app ingest opportunities --backfill
      - name: Awards delta
        if: steps.migrate.outcome == 'success' && env.JOB == 'daily' && !cancelled()
        run: uv run app ingest awards-delta

      - name: Status
        if: steps.migrate.outcome == 'success' && !cancelled()
        run: uv run app status
      # Interim raw archive until object storage exists (M7): kept 90 days per run.
      - name: Upload raw archive
        if: steps.migrate.outcome == 'success' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: raw-archive-${{ github.run_id }}
          path: data/raw/
          if-no-files-found: ignore
          retention-days: 90
