name: Ingest

# Loads notices and awards into the hosted database and runs the incumbent matcher.
# Secrets: DATABASE_URL (Neon *direct* connection string, not the pooled one) and
# SAM_API_KEY. Optional repository variable: SAM_DAILY_REQUEST_LIMIT (default 10).
#
# Daily (scheduled): every active notice from SAM.gov's CSV extract; on Mondays also the
# archived notices of this and last fiscal year (skipped when the file hasn't changed);
# the API notices delta and backfill (attachments, within the SAM request budget); the
# awards delta; then the matcher and the recompete list.
# By hand: GitHub → Actions → Ingest → Run workflow, and pick a job.
on:
  schedule:
    - cron: "23 9 * * *" # 09:23 UTC: early morning US Eastern, before the M4 digest
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        options:
          - daily
          - awards-backfill
          - opportunities-backfill
          - notice-archive
          - match
          - match-diagnose
          - label-sheet
          - match-eval
        default: daily
      years:
        description: Years of award history (awards-backfill only)
        type: string
        default: "5"
      fiscal_year:
        description: Fiscal year to load (notice-archive only; blank = this and last year)
        type: string
        default: ""
      label_size:
        description: Notices in the labeling sheet (label-sheet only)
        type: string
        default: "100"

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest (${{ github.event_name == 'schedule' && 'daily' || inputs.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      SAM_DAILY_REQUEST_LIMIT: ${{ vars.SAM_DAILY_REQUEST_LIMIT || '10' }}
      RAW_ARCHIVE_DIR: ${{ github.workspace }}/data/raw
      JOB: ${{ github.event_name == 'schedule' && 'daily' || inputs.job }}
      YEARS: ${{ inputs.years || '5' }}
      FISCAL_YEAR: ${{ inputs.fiscal_year || '' }}
      LABEL_SIZE: ${{ inputs.label_size || '100' }}
    steps:
      - name: Check secrets
        id: ready
        run: |
          if [ -z "$DATABASE_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::notice::DATABASE_URL secret is not set yet; skipping the scheduled ingest."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Add the DATABASE_URL repository secret (Neon direct connection string)."
            exit 1
          fi
          case "$DATABASE_URL" in
            *-pooler.*)
              echo "::error::DATABASE_URL is Neon's pooled connection string. Use the direct one (no '-pooler' in the host): ingest needs session locks and temp tables."
              exit 1
              ;;
          esac
          case "$JOB" in
            daily|opportunities-backfill)
              if [ -z "$SAM_API_KEY" ]; then
                echo "::error::Add the SAM_API_KEY repository secret."
                exit 1
              fi
              ;;
          esac
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.ready.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.ready.outputs.ok == 'true'
        with:
          version: "0.12.23"
          python-version: "3.12"
      - name: Install
        if: steps.ready.outputs.ok == 'true'
        run: uv sync --locked
      - name: Migrate
        id: migrate
        if: steps.ready.outputs.ok == 'true'
        run: |
          uv run alembic upgrade head
          uv run app doctor

      # Manual jobs
      - name: Awards backfill
        if: steps.migrate.outcome == 'success' && env.JOB == 'awards-backfill'
        run: uv run app ingest awards-backfill --years "$YEARS"
      - name: Notices backfill
        if: steps.migrate.outcome == 'success' && env.JOB == 'opportunities-backfill'
        run: uv run app ingest opportunities --backfill
      - name: Label sheet
        if: steps.migrate.outcome == 'success' && env.JOB == 'label-sheet'
        run: uv run app match label-sheet --size "$LABEL_SIZE" --out matching-labels.csv
      - name: Upload label sheet
        if: steps.migrate.outcome == 'success' && env.JOB == 'label-sheet'
        uses: actions/upload-artifact@v7
        with:
          name: matching-labels-${{ github.run_id }}
          path: matching-labels.csv
          retention-days: 90
      - name: Matcher evaluation
        if: steps.migrate.outcome == 'success' && env.JOB == 'match-eval'
        run: uv run app match eval --report matching-eval.md
      - name: Upload evaluation report
        if: steps.migrate.outcome == 'success' && env.JOB == 'match-eval'
        uses: actions/upload-artifact@v7
        with:
          name: matching-eval-${{ github.run_id }}
          path: matching-eval.md
          retention-days: 90

      # Daily: each step runs even if an earlier one failed
      - name: Notices from SAM.gov's daily CSV
        if: steps.migrate.outcome == 'success' && env.JOB == 'daily' && !cancelled()
        run: uv run app ingest notice-extract
      - name: Archived notices (Mondays, or notice-archive)
        if: >-
          steps.migrate.outcome == 'success' && !cancelled() &&
          (env.JOB == 'notice-archive' || env.JOB == 'daily')
        run: |
          if [ "$JOB" = "daily" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "Archived notices are loaded on Mondays."
            exit 0
          fi
          if [ -n "$FISCAL_YEAR" ]; then
            years="$FISCAL_YEAR"
          else
            fy=$(date -u +%Y)
            if [ "$(date -u +%-m)" -ge 10 ]; then fy=$((fy + 1)); fi
            years="$((fy - 1)) $fy"
          fi
          for year in $years; do
            uv run app ingest notice-archive --fiscal-year "$year"
          done
      - name: Notices delta (API)
        if: steps.migrate.outcome == 'success' && env.JOB == 'daily' && !cancelled()
        run: uv run app ingest opportunities
      - name: Notices backfill (API, resumes until complete)
        if: steps.migrate.outcome == 'success' && env.JOB == 'daily' && !cancelled()
        run: uv run app ingest opportunities --backfill
      - name: Awards delta
        if: steps.migrate.outcome == 'success' && env.JOB == 'daily' && !cancelled()
        run: uv run app ingest awards-delta
      - name: Match notices to incumbents
        if: >-
          steps.migrate.outcome == 'success' && !cancelled() &&
          (env.JOB == 'daily' || env.JOB == 'match')
        run: uv run app match notices
      - name: Refresh recompetes
        if: >-
          steps.migrate.outcome == 'success' && !cancelled() &&
          (env.JOB == 'daily' || env.JOB == 'match')
        run: uv run app recompetes refresh
      - name: Matcher diagnosis
        if: >-
          steps.migrate.outcome == 'success' && !cancelled() &&
          (env.JOB == 'match' || env.JOB == 'match-diagnose')
        run: uv run app match diagnose

      - name: Status
        if: steps.migrate.outcome == 'success' && !cancelled()
        run: uv run app status
      # Interim raw archive until object storage exists (M7): kept 90 days per run.
      - name: Upload raw archive
        if: steps.migrate.outcome == 'success' && !cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: raw-archive-${{ github.run_id }}
          path: data/raw/
          if-no-files-found: ignore
          retention-days: 90
